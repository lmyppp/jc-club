server:
  port: 5000
spring:
  datasource:
    username: root
    #    password: 123456
    password: IbwMxYfyCofpfXjmwk9SIA0GAU2hWLW1nvA/Lk5kcsy9m5dd2f6qotSd1pOdj59jt2WjmI10hoG7jfmb2kme0g==
    #    jdbc:mysql://localhost:3306/mybatis?useUnicode=true&characterEncoding=utf-8
    url: jdbc:mysql://localhost:3306/jc-club?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 20
      min-idle: 20
      #      会根据publicKey解密   解密后的password。${publicKey}：公用变量
      connectionProperties: config.decrypt=true;config.decrypt.key=${publicKey};
      max-active: 100
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: root
        login-password: 123456
      filter:
        stat:
          #          开启过滤器
          enabled: true
          #          执行时间大于2000毫秒的都是慢SQL
          slow-sql-millis: 2000
          #          日志记录慢SQL
          log-slow-sql: true
        #    防火墙
        wall:
          enabled: true
        #          开启druid的配置，才会去解密  密码
        config:
          enabled: true
  # redis配置
  redis:
    # Redis数据库索引（默认为0）
    database: 1
    # Redis服务器地址
    host: 192.168.70.132
    # Redis服务器连接端口
    port: 6379
    # Redis服务器连接密码（默认为空）
    password: 123456
    # 连接超时时间
    timeout: 2s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0
#公钥字符串
publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAIWjpaPnyNKCDTDDK9dcqgYczbYJRom/g2zfq8OFba/3XMd+ISzyysoOZ+rY1wfBgfBH/Bp1LOSop0TjupIgWpkCAwEAAQ==
#log4j2配置生效
logging:
  config: classpath:log4j2-spring.xml
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

